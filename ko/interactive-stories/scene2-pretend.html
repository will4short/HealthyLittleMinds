      벨라는 깊게 숨을 들이쉬고 미소를 지었어요.<br>
      하지만 속으로는 아직도 긴장되고 무서웠어요.<br>
      아무에게도 말하지 않고, 그냥 괜찮은 척했어요.
    </p>

    <div class="thought-bubble">“아무도 모르게… 난 괜찮은 척할 수 있어.”</div>
    <div class="parent-tip">
      <strong>👪 부모를 위한 팁:</strong> 아이들은 때때로 감정을 숨기기 위해 괜찮은 척을 해요.<br>
