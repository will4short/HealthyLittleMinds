<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>よろこび（Joy）</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background:
        radial-gradient(ellipse 80% 60% at 60% 20%, rgba(175, 109, 255, 0.50), transparent 65%),
        radial-gradient(ellipse 70% 60% at 20% 80%, rgba(255, 100, 180, 0.45), transparent 65%),
        radial-gradient(ellipse 60% 50% at 60% 65%, rgba(255, 235, 170, 0.43), transparent 62%),
        radial-gradient(ellipse 65% 40% at 50% 60%, rgba(120, 190, 255, 0.48), transparent 68%),
        linear-gradient(180deg, #f7eaff 0%, #fde2ea 100%);
      background-attachment: fixed;
      background-size: 100% 100%;
      text-align: center;
      padding: 4rem 2rem;
      color: #254E70;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
    }
    p {
      font-size: 1.2rem;
      color: #555;
    }
    .back-btn {
      display: inline-block;
      margin-top: 2rem;
      padding: 10px 20px;
      background-color: #FF6B6B;
      color: white;
      text-decoration: none;
      font-weight: bold;
      border-radius: 8px;
      transition: background-color 0.3s ease;
    }
    .back-btn:hover {
      background-color: #e25555;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      max-width: 320px;
      margin: 3rem auto 1rem;
      padding: 2rem 1.5rem;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.05);
      text-align: center;
    }

    .card img {
      width: 100%;
      border-radius: 12px;
      margin-top: 1rem;
    }

    .card a {
      display: inline-block;
      margin-top: 1rem;
      background-color: #FFDD59;
      color: #254E70;
      padding: 0.6rem 1.2rem;
      border-radius: 30px;
      font-weight: bold;
      text-decoration: none;
    }

    .card a:hover {
      background-color: #ffe98d;
    }

    .card h4 {
      color: #FF6B6B;
      margin-bottom: 0.6rem;
    }

    .card p {
      font-size: 0.95rem;
      color: #333;
    }
  </style>
</head>
<body>
<script>
  (function () {
    const isLocal = location.protocol === 'file:';
    const isMember = localStorage.getItem("isMember") === "true";

    if (!isLocal && !isMember) {
      const path = window.location.pathname;
      const locale = path.split('/')[1];
      const redirectTo = locale && path.includes(`/${locale}/`) 
        ? `/${locale}/index.html` 
        : "/index.html";
      window.location.replace(redirectTo);
    }
  })();
</script>

  <h1>🧠 よろこびのリソースはまもなく公開！</h1>

  </div>
