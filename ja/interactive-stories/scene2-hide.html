<script>
  // 🔒 Redirect to login page if not logged in
  (function () {
    const isMember = localStorage.getItem("isMember") === "true";

    if (!isMember) {
      const path = window.location.pathname;
      const locale = path.split('/')[1]; // e.g., 'ko', 'zh-tw', etc.
      const redirectTo = locale && path.includes(`/${locale}/`) 
        ? `/${locale}/index.html` 
        : "/index.html";
      window.location.replace(redirectTo); // 👈 Smooth silent redirect
    }
  })();
</script>
