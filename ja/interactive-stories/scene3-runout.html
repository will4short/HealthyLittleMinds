<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>😢 シーン3 – ベラは飛び出す</title>
  <style>
  body {
    font-family: 'Segoe UI', sans-serif;
    background-color: #FFF0F0;
    color: #333;
    margin: 0;
    padding: 2rem;
    text-align: center;
    line-height: 1.6;
  }

  .scene-wrapper {
    max-width: 720px;
    margin: auto;
    background: #ffffff;
    padding: 2rem;
    border-radius: 20px;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.05);
  }

  h1 {
    font-size: 2rem;
    margin-bottom: 1.2rem;
    color: #C62828;
  }

  p {
    font-size: 1.1rem;
    max-width: 680px;
    margin: 0.8rem auto;
    padding: 0 1rem;
  }

  img {
    width: 90%;
    max-width: 480px;
    border-radius: 12px;
    margin: 2rem auto 1rem;
    display: block;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
  }

  .quote {
    background: #F8D7DA;
    border-left: 5px solid #E57373;
    padding: 1rem;
    font-style: italic;
    font-size: 1rem;
    margin: 1.5rem auto;
    max-width: 600px;
    border-radius: 10px;
  }

  .buttons {
    margin-top: 2rem;
    display: flex;
    justify-content: center;
  }

  .buttons a {
    background: #FFCDD2;
    padding: 0.75rem 1.5rem;
    border-radius: 8px;
    text-decoration: none;
    color: #000;
    font-weight: bold;
    box-shadow: 2px 2px 6px rgba(0,0,0,0.1);
    transition: background 0.3s ease;
  }

  .buttons a:hover {
    background: #EF9A9A;
  }

  @media (max-width: 600px) {
    body {
      padding: 1rem;
    }

    h1 {
      font-size: 1.6rem;
    }

    p {
      font-size: 1rem;
    }

    .quote {
      font-size: 0.95rem;
      padding: 0.8rem;
    }

    .buttons a {
      font-size: 0.95rem;
      padding: 0.6rem 1.2rem;
    }
  }
</style>

</head>
<body>
<script>
  // 🔒 Redirect to login page if not logged in
  (function () {
    const isMember = localStorage.getItem("isMember") === "true";

    if (!isMember) {
      const path = window.location.pathname;
      const locale = path.split('/')[1]; // e.g., 'ko', 'zh-tw', etc.
      const redirectTo = locale && path.includes(`/${locale}/`) 
        ? `/${locale}/index.html` 
        : "/index.html";
      window.location.replace(redirectTo); // 👈 Smooth silent redirect
    }
  })();
</script>

<div style="
  position: fixed;
  top: 15px;
  right: 15px;
  z-index: 1000;
  background: #E6E6FA;
  border: 2px solid #D8BFD8;
  border-radius: 30px;
  padding: 0.5rem 1rem;
  box-shadow: 0 4px 8px rgba(0,0,0,0.1);
">
  <a href="../home.html" style="
    text-decoration: none;
    color: #5A3E8A;
    font-weight: bold;
    font-size: 0.95rem;
  ">
    🏠 ホームにもどる
  </a>
</div>

  <div class="scene-wrapper">
    <h1>😢 シーン3 – ベラは飛び出す</h1>
    <p>ベラは突然、動けなくなり…そのまま部屋を飛び出してしまいました。</p>
    <div class="scene-image">
      <img src="../images/scene3-runout.png" alt="走って出て行くベラ" />
    </div>
    <div class="quote">「できなかった。どうしても…無理だった。」</div>
    <p>大丈夫。誰にでもこういう瞬間はあります。</p>

    <div class="buttons">
      <a href="scene_1_bella_story.html">🔁 最初からもう一度</a>
    </div>
  </div>
</body>
</html>
