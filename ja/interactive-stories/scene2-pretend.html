<head>

  <title>😐 シーン2 – ベラは平気なふりをする</title>
  <style>
    body { background-color: #fff8ec; font-family: "Segoe UI", sans-serif; margin: 0; padding: 0; color: #2e2e2e; }
    .scene-wrapper { max-width: 800px; margin: 2rem auto; background-color: #ffffff; border-radius: 16px; padding: 2rem; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05); }
    h1 { font-size: 1.8rem; text-align: center; margin-bottom: 1rem; }
    .story-text { font-size: 1.1rem; line-height: 1.7; text-align: center; margin-bottom: 1.5rem; }
    .scene-img { max-width: 50%; height: auto; border-radius: 12px; display: block; margin: 1rem auto 2rem; }
    .thought-bubble { background-color: #fff3cd; border-left: 5px solid #f0ad4e; padding: 1rem; font-style: italic; margin-bottom: 1.5rem; border-radius: 12px; font-size: 1.05rem; }
    .parent-tip { background-color: #e0f7fa; border-left: 5px solid #00bcd4; padding: 1rem; font-size: 1rem; border-radius: 12px; margin-bottom: 2rem; }
    .nav-buttons { display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap; margin-top: 1.5rem; }
    .choice-btn { background-color: #ffd76a; color: #444; padding: 0.9rem 1.4rem; border-radius: 32px; font-size: 1rem; font-weight: bold; text-decoration: none; border: none; transition: background-color 0.3s ease, transform 0.2s ease; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    .choice-btn:hover { background-color: #ffc048; transform: translateY(-2px); color: #000; }
    @media (max-width: 600px) { body { padding: 1rem; } .scene-wrapper { padding: 1.5rem 1rem; } }
  </style>
</head>
<body>
<script>
  // 🔒 Redirect to login page if not logged in
  (function () {
    const isMember = localStorage.getItem("isMember") === "true";

    if (!isMember) {
      const path = window.location.pathname;
      const locale = path.split('/')[1]; // e.g., 'ko', 'zh-tw', etc.
      const redirectTo = locale && path.includes(`/${locale}/`) 
        ? `/${locale}/index.html` 
        : "/index.html";
      window.location.replace(redirectTo); // 👈 Smooth silent redirect
    }
  })();
</script>

  top: 15px;

">

    </div>
    <div class="nav-buttons">
      <a href="scene_5_calm.html" class="choice-btn">✨ 試してみる</a>
      <a href="scene5-regret.html" class="choice-btn">😞 機会を逃す</a>
