  <link rel="stylesheet" href="../../style.css" />
  <style>
    body {
      font-family: 'DM Sans', sans-serif;
      background: #fff2e5;
      color: #254E70;
      margin: 0;
      padding: 2rem;
    }
    .scene-wrapper {
      max-width: 700px;
      margin: auto;
      background: #ffffff;
      padding: 2rem;
      border-radius: 20px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.05);
      text-align: center;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1.2rem;
    }
    .reflection {
      background: #ffe3e3;
      border-radius: 12px;
      padding: 1rem;
      margin: 2rem 0;
      font-weight: bold;
      color: #254E70;
    }
    .scene-image img {
      width: 100%;
      max-width: 320px;
      border-radius: 12px;
      margin-top: 1rem;
    }
    .btn-end {
      display: inline-block;
      background: #ff6b6b;
      color: white;
      font-weight: bold;
      padding: 0.8rem 1.5rem;
      border-radius: 12px;
      text-decoration: none;
      margin-top: 1.5rem;
    }
    @media (max-width: 600px) {
      body {
        padding: 1rem;
      }
      .scene-wrapper {
        padding: 1.5rem 1rem;
      }
    }
  </style>
</head>
<body>
<script>
  // 🔒 Redirect to login page if not logged in
  (function () {
    const isMember = localStorage.getItem("isMember") === "true";

    if (!isMember) {
      const path = window.location.pathname;
      const locale = path.split('/')[1]; // e.g., 'ko', 'zh-tw', etc.
      const redirectTo = locale && path.includes(`/${locale}/`) 
        ? `/${locale}/index.html` 
        : "/index.html";
      window.location.replace(redirectTo); // 👈 Smooth silent redirect
    }
  })();
</script>
