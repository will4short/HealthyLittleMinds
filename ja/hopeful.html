  <style>
    body { font-family: 'Nunito', sans-serif; background: radial-gradient(125% 125% at 50% 90%, #ffffff 40%, #10b981 100%); background-attachment: fixed; background-size: 100% 100%; color: #254E70; padding: 2rem; text-align: center; }
    a { display: inline-block; margin-top: 2rem; color: #FF6B6B; text-decoration: none; font-weight: bold; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
<script>
  (function () {
    const isLocal = location.protocol === 'file:';
    const isMember = localStorage.getItem("isMember") === "true";

    if (!isLocal && !isMember) {
      const path = window.location.pathname;
      const locale = path.split('/')[1];
      const redirectTo = locale && path.includes(`/${locale}/`) 
        ? `/${locale}/index.html` 
        : "/index.html";
      window.location.replace(redirectTo);
    }
  })();
</script>

  <h2>🙏 感謝の気持ち</h2>

</body>
