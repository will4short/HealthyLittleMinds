  <p>貝拉輕鬆地走出教室。</p>
  <p>她對自己輕輕微笑——她很高興自己鼓起勇氣說出口。</p>
  <p>那種害怕的感覺並沒有完全消失，但現在感覺沒那麼可怕了。</p>
