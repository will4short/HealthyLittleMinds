    <p class="story-text">
      貝拉今天學到了一件重要的事：<br>
      她的每一個選擇都引導她走上不同的道路。<br><br>
      害怕、沉默、說出口——每一步都很重要。<br>
      即使遇到困難，她也沒有放棄。<br><br>
      🌈 <strong>你的選擇也很重要。</strong><br>
      它們能讓你每天都更勇敢、更堅強、更有愛。
    </p>

    <img src="images/scene6-end.png" alt="自信前進的貝拉" class="scene-img" />

<div class="parent-tip" style="background-color: #fff6e0; padding: 1.5rem; border-radius: 12px; font-size: 1rem; line-height: 1.6; max-width: 800px; margin: 2rem auto; text-align: left;">
  🧠 <strong>給家長的小提醒：</strong> 孩子的每個選擇——無論是勇敢還是安靜——都在形塑他們成為怎樣的人。<br>
