<script>
(function(){
  const opts = { root: null, rootMargin: '200px 0px', threshold: 0.01 };
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        const v = entry.target;
        if(!v.dataset.loaded){
          v.querySelectorAll('source[data-src]').forEach(s=>{
            s.src = s.dataset.src;
          });
          v.load();
          v.dataset.loaded = '1';
        }
        io.unobserve(v);
      }
    });
  }, opts);

  document.querySelectorAll('.video-card video').forEach(v=>io.observe(v));
})();
</script>
