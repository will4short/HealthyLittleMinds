  .scene-wrapper {

    margin: auto;
    background: #ffffff;
    padding: 2rem;
    border-radius: 20px;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.05);
  }

  h1 {

    margin-bottom: 1.2rem;

  }

    margin: 1.5rem auto;

    display: flex;
    justify-content: center;
  }

  .buttons a {
    background: #FFCDD2;
    padding: 0.75rem 1.5rem;
    border-radius: 8px;
    text-decoration: none;
    color: #000;
    font-weight: bold;
    box-shadow: 2px 2px 6px rgba(0,0,0,0.1);
    transition: background 0.3s ease;
  }

  .buttons a:hover {
    background: #EF9A9A;

    }

    h1 {
      font-size: 1.6rem;
    }

    p {
      font-size: 1rem;
