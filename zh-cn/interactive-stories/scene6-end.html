    <p class="story-text">
      贝拉今天学到了一个重要的道理：<br>
      她做出的每一个选择，都通向不同的道路。<br><br>
      害怕、沉默、说出来——每一种反应都有意义。<br>
      即使事情很难，她也一直在努力尝试。<br><br>
      🌈 <strong>你的选择也很重要。</strong><br>
      它们可以帮助你变得更勇敢、更坚强、更有爱心。
    </p>
