<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>You are offline | Healthy Little Minds</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 1rem; display: grid; place-items: center; font-family: 'Nunito', Arial, sans-serif; background: #eef9ff; color: #294557; }
    .offline-card { width: min(100%, 620px); padding: clamp(1.25rem, 5vw, 2.4rem); border: 1px solid #d7e7ee; border-radius: 8px; background: #fff; box-shadow: 0 18px 42px rgba(37, 78, 112, .13); text-align: center; }
    .offline-logo { width: 86px; height: 86px; margin: 0 auto 1rem; object-fit: contain; }
    .offline-kicker { margin: 0 0 .35rem; color: #ff6b6b; font-size: .78rem; font-weight: 900; text-transform: uppercase; }
    h1 { margin: 0; color: #254e70; font-size: clamp(1.7rem, 6vw, 2.4rem); }
    p { max-width: 470px; margin: .75rem auto 0; line-height: 1.6; }
    .offline-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: .65rem; margin-top: 1.25rem; }
    .offline-actions button, .offline-actions a { min-height: 46px; padding: .7rem 1rem; border: 1px solid #254e70; border-radius: 8px; font: inherit; font-weight: 900; cursor: pointer; text-decoration: none; }
    .offline-actions button { background: #254e70; color: #fff; }
    .offline-actions a { background: #fff; color: #254e70; }
    #connectionStatus { margin-top: 1rem; color: #587083; font-size: .88rem; font-weight: 800; }
  </style>
  <link href="site-ui-upgrades.css?v=1" rel="stylesheet" />
</head>
<body class="ui-upgraded">
  <main class="offline-card">
    <img class="offline-logo" src="/images/logo-icon.webp" alt="Healthy Little Minds" />
    <p class="offline-kicker">Connection paused</p>
    <h1>You are offline</h1>
    <p>Your saved pages may still be available. Reconnect and try again when you are ready.</p>
    <div class="offline-actions">
      <button class="no-loader" id="retryConnection" type="button">Try again</button>
      <a href="/home.html">Open saved home page</a>
    </div>
    <p id="connectionStatus" role="status" aria-live="polite">Waiting for a connection.</p>
  </main>
  <script>
    (function () {
      var button = document.getElementById('retryConnection');
      var status = document.getElementById('connectionStatus');
      function retry() {
        if (navigator.onLine) {
          status.textContent = 'Connection restored. Reloading...';
          window.location.reload();
        } else {
          status.textContent = 'Still offline. Your saved pages remain available.';
        }
      }
      button.addEventListener('click', retry);
      window.addEventListener('online', retry);
    }());
  </script>
  <script defer src="button-loader.js?v=1"></script>
</body>
</html>
